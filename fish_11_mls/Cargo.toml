[package]
name = "fish_11_mls"
version = "0.1.0"
edition = "2021"
description = "FCEP-2 MLS group encryption core for FiSH-11"
license = "GPL-3.0-or-later"
authors = ["GuY"]

[lib]
name = "fish_11_mls"
crate-type = ["rlib"]

[features]
extensions-draft-08 = []

[dependencies]
# MLS core is pinned to 0.8.1 for API stability
openmls = { version = "=0.8.1", features = ["openmls_rust_crypto"] }
openmls_rust_crypto = "=0.5.1"
openmls_basic_credential = "=0.5.0"
openmls_traits = "=0.5.0"
tls_codec = "=0.4.2"

# Encoding
base64 = "0.22"

# Security
secrecy = "0.8"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
sha2 = "0.11"
chrono = "0.4"
thiserror = "2"
rand = "0.8.7"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
hkdf = "0.13"
chacha20poly1305 = "0.10.1"

[dev-dependencies]
tempfile = "3"
