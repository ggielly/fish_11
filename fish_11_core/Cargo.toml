[package]
name = "fish_11_core"
version = "11.25.0"
edition = "2021"
authors = ["GuY"]
description = "FiSH_11 - Core utilities (platform-independent)"
license = "GPL-3.0-or-later"

[lib]
name = "fish_11_core"
crate-type = ["lib"]

[dependencies]
once_cell = "1.20.2"
regex = "1.11.1"
log = { version = "0.4", features = ["std"] }
chrono = { version = "0.4", features = ["serde"] }
lazy_static = "1.4"
rand = "0.8.6"
scopeguard = "1.2.0"
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
# Must match hkdf 0.12 / digest 0.10 (see Hkdf::<Sha256>); sha2 0.11 pulls digest 0.11 and breaks HKDF.
sha2 = "0.10"
secrecy = "0.8"
serde = { version = "1.0", features = ["derive"] }
zeroize = "1.8"
rust-ini = "0.21.3"
base64 = "0.22"
tempfile = "3.24.0"

[build-dependencies]
vergen = { version = "9.0.6", features = ["build", "cargo", "rustc", "si"] }

