[package]
name = "fish_11"
version = "11.26.0"
edition = "2021"
description = "FiSH_11 - secure encryption for mIRC : the core library"
license = "GPL-3.0-or-later"
authors = ["GuY"]

[lib]
name = "fish_11"
# Building appropriate library type based on platform
# On Linux/BSD: static library (a) + rlib for linking
# On Windows: dynamic library (dll) + rlib for linking
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
lazy_static = "1.4"
once_cell = "1"
# An implementation of elliptic curve Diffie-Hellman key exchange over Curve25519.
x25519-dalek = { version = "2", features = ["static_secrets", "getrandom"] }
chacha20poly1305 = "0.10"
crypto = "0.5.1"

rand = "0.8.7"                                   # Can't bump to 0.9.2 because x25519 is not compatible >v0.9
sha2 = "0.10"
base64 = "0.22.1"
log = { version = "0.4.26", features = ["std"] }
chrono = "0.4.40"
rust-ini = "0.21.3"

# Security enhancements
subtle = "2.5"
secrecy = "0.8"         # Can't bump to 0.10.0 because of a breaking change
hkdf = "0.12"
hmac = "0.12"
lru_time_cache = "0.11"
zeroize = "1.8"
libc = "0.2.177"
parking_lot = "0.12"
thiserror = "2.0"

# FCEP-2 dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }

# Legacy compatibility
dirs = "6.0"
tempfile = "3"
sha1 = "0.11"
hex = "0.4"
blowfish = "0.9"
byteorder = "1.5"
cbc = { version = "0.1", features = ["std"] }
cipher = "0.4"
num-bigint = { version = "0.4", features = ["rand"] }
num-traits = "0.2"
aes-keywrap = "0.9"

# OpenMLS (pinned to exact versions matching fish_11_mls)
openmls = { version = "=0.8.1", features = ["openmls_rust_crypto"] }
openmls_rust_crypto = "=0.5.1"
openmls_basic_credential = "=0.5.0"
openmls_traits = "=0.5.0"
tls_codec = "=0.4.2"

# Shared core library
fish_11_core = { path = "../fish_11_core" }
fish_11_mls = { path = "../fish_11_mls" }

# Platform-specific dependencies
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.0"

[package.metadata.cargo-post]
post-build = [
    "mt.exe",
    "-manifest",
    "fish_11.dll.manifest",
    "-outputresource:target/debug/fish_11.dll;2",
]
